; Extra uwsgi options for the Toolforge deployment.
;
; Toolforge's webservice runner adds `--ini $HOME/www/python/uwsgi.ini` when the
; file exists, and merges it with the options it passes on the command line
; (chdir, wsgi-file, callable, workers, venv, ...). Copy this file there:
;
;     cp deploy/uwsgi.ini "$HOME/www/python/uwsgi.ini"
;
; Then restart the webservice.
;
; buffer-size: uwsgi's default request-header buffer is 4 KiB. Wikimedia's
; OAuth 2.0 authorization codes are ~750 characters, and the Toolforge ingress
; forwards the whole request URI as the X-Original-URI header. Together that
; pushed the header block past 4 KiB, so uwsgi dropped the request while
; Envoy reported "upstream connect error or disconnect/reset before headers".
; The callback request is now ~3.4 KiB of headers, well inside this limit.
[uwsgi]
buffer-size = 65535
