<!DOCTYPE html>
 <html lang="{{ lang }}">
  <head>
  <meta charset="UTF-8">
  <title>{{ msg('wrv-app-name') }}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

  <!-- Navbar -->
   {% include 'navbar.html' %}

<div class="floating-icons">
  <i class="bi bi-link-45deg"></i>
  <i class="bi bi-book"></i>
  <i class="bi bi-link-45deg"></i>
  <i class="bi bi-check2-circle"></i>
  <i class="bi bi-link-45deg"></i>
  <i class="bi bi-search"></i> <!-- 🔍 Search icon added -->
</div>

  <div class="container app-container">
    <div class="text-center mb-4">
      <h1 class="fw-bold app-title">
        <i class="bi bi-search-heart"></i> {{ msg('wrv-app-name') }}
      </h1>
      <p class="text-light">{{ msg('wrv-index-subtitle') }}</p>
      </div>

    <!-- Search Section -->
   <!-- Search Section -->
<div id="searchSection" class="card glass-card p-4 mb-4">
  <div class="mb-3 position-relative">
       <input type="text" id="search" class="form-control form-control-lg"
              placeholder="{{ msg('wrv-index-search-placeholder') }}">
    <ul id="suggestions" class="list-group"></ul>
  </div>
  <div class="text-center">
    <button class="btn btn-lg btn-glass shadow" onclick="validate()">
      <i class="bi bi-shield-check"></i> {{ msg('wrv-index-validate-button') }}  
      </button>
  </div>
</div>


    <!-- Results -->
    <div id="result"></div>
  </div>
  {% include 'i18n_js.html' %}
  <script src="{{ url_for('static', filename='script.js') }}"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
