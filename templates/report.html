<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Reference Validation Report</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      background-color: #f8f9fa;
    }

    h2 {
      font-weight: 600;
    }

    .card {
      border-radius: 12px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
    }

    .chart-container {
      position: relative;
      height: 300px;
      width: 100%;
    }

    .accordion-button .ref-url {
      display: inline-block;
      max-width: 250px;   /* truncate long urls */
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      vertical-align: middle;
    }

    .accordion-body a {
      display: inline-block;
      max-width: 250px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      vertical-align: middle;
    }
  </style>
</head>
<body>

<div class="container my-5">
  <!-- Title -->
  <h2 class="mb-4 text-center">📊 Reference Validation Report</h2>

  <!-- Summary badges -->
  <div class="d-flex justify-content-center gap-3 mb-4 flex-wrap">
    <span class="badge bg-success p-3 fs-6">
      ✅ Alive: <span id="aliveCount">0</span>
    </span>
    <span class="badge bg-danger p-3 fs-6">
      ❌ Dead: <span id="deadCount">0</span>
    </span>
    <span class="badge bg-info text-dark p-3 fs-6">
      🔁 Archived Available: <span id="archiveCount">0</span>
    </span>
  </div>

  <!-- Charts -->
  <div class="row mb-4">
    <!-- Pie Chart -->
    <div class="col-md-6 mb-4">
      <div class="card">
        <div class="card-body text-center">
          <h5 class="card-title">Alive vs Dead (Pie)</h5>
          <div class="chart-container">
            <canvas id="refChart"></canvas>
          </div>
        </div>
      </div>
    </div>

    <!-- Bar Chart -->
    <div class="col-md-6 mb-4">
      <div class="card">
        <div class="card-body text-center">
          <h5 class="card-title">Alive vs Dead (Histogram)</h5>
          <div class="chart-container">
            <canvas id="refBarChart"></canvas>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Detailed References -->
  <div class="card mb-4">
    <div class="card-body">
      <h5 class="card-title mb-3">Detailed References</h5>
      <div class="accordion" id="refAccordion"></div>
    </div>
  </div>

  <!-- Actions -->
  <div class="text-center mt-4 d-flex justify-content-center gap-2">
    <a href="{{ url_for('home') }}" class="btn btn-secondary">🔄 New Validation</a>
    <button id="downloadBtn" class="btn btn-success">⬇️ Download Results</button>
  </div>
</div>

<script>
  const raw = localStorage.getItem("reportData");
  if (raw) {
    const report = JSON.parse(raw);

    // Fill badges
    document.getElementById("aliveCount").textContent = report.aliveCount;
    document.getElementById("deadCount").textContent = report.deadCount;
    const archivedCount = report.archivedCount !== undefined
      ? report.archivedCount
      : (report.references || []).filter(r => r.status === "dead" && r.suggestedArchive).length;
    const archiveCountEl = document.getElementById("archiveCount");
    if (archiveCountEl) {
      archiveCountEl.textContent = archivedCount;
    }

    // Pie Chart
    new Chart(document.getElementById("refChart"), {
      type: "pie",
      data: {
        labels: ["Alive", "Dead"],
        datasets: [{
          data: [report.aliveCount, report.deadCount],
          backgroundColor: ["#28a745", "#dc3545"]
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false
      }
    });

    // Histogram (Bar Chart)
    new Chart(document.getElementById("refBarChart"), {
      type: "bar",
      data: {
        labels: ["Alive", "Dead"],
        datasets: [{
          label: "References",
          data: [report.aliveCount, report.deadCount],
          backgroundColor: ["#28a745", "#dc3545"]
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: { y: { beginAtZero: true, ticks: { precision: 0 } } }
      }
    });

    // Accordion for references
    const accordion = document.getElementById("refAccordion");
    report.references.forEach((ref, i) => {
      const item = document.createElement("div");
      item.className = "accordion-item";
      item.innerHTML = `
        <h2 class="accordion-header" id="heading${i}">
          <button class="accordion-button collapsed d-flex justify-content-between align-items-center"
            type="button"
            data-bs-toggle="collapse" data-bs-target="#collapse${i}"
            aria-expanded="false" aria-controls="collapse${i}">
            <span class="ref-url" title="${ref.url}">
              ${ref.url}
            </span>
            <span class="ms-2">
              ${ref.status === "alive" ? "✅ Alive" : "❌ Dead"}
            </span>
          </button>
        </h2>
        <div id="collapse${i}" class="accordion-collapse collapse"
          aria-labelledby="heading${i}" data-bs-parent="#refAccordion">
          <div class="accordion-body">
            <p><strong>Property:</strong> ${ref.propertyLabel}</p>
            ${ref.statementValue ? `<p><strong>Value:</strong> ${ref.statementValue}</p>` : ""}
            <p><strong>URL:</strong> <a href="${ref.url}" target="_blank" title="${ref.url}">${ref.url}</a></p>
            ${
              ref.status === "dead"
              ? `
                <div class="alert alert-warning p-2 mt-2 mb-2">
                  ⚠️ <strong>Reference unavailable.</strong> Please review or update this reference on Wikidata.
                </div>
                ${
                  ref.suggestedArchive
                  ? `
                    <div class="p-3 border border-info rounded bg-white mt-2">
                      <div class="fw-bold text-primary mb-1">
                        🔁 Suggested Archive (Internet Archive):
                      </div>
                      <div class="text-break mb-1">
                        <a href="${ref.suggestedArchive.archiveUrl}" target="_blank" class="fw-semibold link-primary">
                          ${ref.suggestedArchive.archiveUrl}
                        </a>
                      </div>
                      ${
                        ref.suggestedArchive.archiveDateLabel || ref.suggestedArchive.archiveDate
                        ? `<div class="text-muted small mt-1">
                             📅 Snapshot Date: <strong>${ref.suggestedArchive.archiveDateLabel || ref.suggestedArchive.archiveDate}</strong>
                             ${ref.suggestedArchive.archiveDate ? ` &bull; Wikidata P2960: <code>${ref.suggestedArchive.archiveDate}</code>` : ""}
                           </div>`
                        : ""
                      }
                      <div class="mt-2 d-flex gap-2 flex-wrap">
                        <button class="btn btn-sm btn-outline-primary"
                                onclick="copyReportArchive('${encodeURIComponent(ref.suggestedArchive.archiveUrl)}', this, 'URL')">
                          📋 Copy Archive URL
                        </button>
                        ${
                          ref.suggestedArchive.archiveDate
                          ? `
                          <button class="btn btn-sm btn-outline-secondary"
                                  onclick="copyReportArchive('${encodeURIComponent(ref.suggestedArchive.archiveDate)}', this, 'Date')">
                            📅 Copy Date
                          </button>
                          `
                          : ""
                        }
                        <a href="${ref.suggestedArchive.archiveUrl}" target="_blank" class="btn btn-sm btn-primary">
                          Open Snapshot
                        </a>
                      </div>
                    </div>
                  `
                  : `
                    <div class="p-2 border rounded bg-light text-muted small mt-2">
                      📭 No direct archive snapshot found on Wayback Machine.
                      <div class="mt-2 d-flex gap-2 flex-wrap">
                        <a href="https://web.archive.org/web/*/${encodeURIComponent(ref.url)}" target="_blank" class="btn btn-sm btn-outline-secondary">
                          Search Wayback History
                        </a>
                        <a href="https://web.archive.org/save/${encodeURIComponent(ref.url)}" target="_blank" class="btn btn-sm btn-outline-secondary">
                          Save to Wayback
                        </a>
                      </div>
                    </div>
                  `
                }
              `
              : ""
            }
          </div>
        </div>
      `;
      accordion.appendChild(item);
    });
  } else {
    // If opened without validation
    document.body.innerHTML = `
      <div class="container my-5 text-center">
        <div class="alert alert-warning">
          ⚠️ No report data found. Please run a validation first.
        </div>
        <a href="{{ url_for('home') }}" class="btn btn-primary">Go Back</a>
      </div>
    `;
  }

  // Clipboard helper for Report page
  function copyReportArchive(encodedText, btn, type = "URL") {
    const text = decodeURIComponent(encodedText);
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(() => {
        const originalText = btn.innerHTML;
        btn.innerHTML = `✓ ${type} Copied!`;
        btn.classList.add("btn-success");
        setTimeout(() => {
          btn.innerHTML = originalText;
          btn.classList.remove("btn-success");
        }, 2000);
      }).catch(() => {
        prompt(`Copy ${type}:`, text);
      });
    } else {
      prompt(`Copy ${type}:`, text);
    }
  }

  // Handle Download CSV with Archive columns
  const downloadBtn = document.getElementById("downloadBtn");
  if (downloadBtn) {
    downloadBtn.onclick = () => {
      const results = localStorage.getItem("reportData");
      if (!results) {
        alert("No report data available to download.");
        return;
      }

      const report = JSON.parse(results);

      // Convert to CSV
      const headers = ["URL", "Status", "Property", "Statement Value", "Archive URL", "Archive Date"];
      const rows = (report.references || []).map(r => [
        `"${(r.url || "").replace(/"/g, '""')}"`,
        r.status,
        `"${(r.propertyLabel || "").replace(/"/g, '""')}"`,
        `"${(r.statementValue || "").replace(/"/g, '""')}"`,
        `"${(r.suggestedArchive && r.suggestedArchive.archiveUrl ? r.suggestedArchive.archiveUrl : "").replace(/"/g, '""')}"`,
        `"${(r.suggestedArchive && r.suggestedArchive.archiveDate ? r.suggestedArchive.archiveDate : "").replace(/"/g, '""')}"`
      ]);

      const csvContent = [headers.join(","), ...rows.map(r => r.join(","))].join("\r\n");

      // Trigger download
      const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);

      const a = document.createElement("a");
      a.href = url;
      a.download = `validation-report-${report.qid || "wikidata"}.csv`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);

      URL.revokeObjectURL(url);
    };
  }
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
